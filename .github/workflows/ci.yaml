name: CI/CD

on:
    push:
    pull_request:
    workflow_dispatch:

env:
    CEDEV_VERSION: v15.0

jobs:
    ci:
        runs-on: ubuntu-latest
        container: fedora:latest
        steps:
            - name: Install build dependencies
              run: dnf install -y git make clang cmake tar gzip zlib

            - uses: actions/checkout@v7
              with:
                  submodules: true
                  fetch-depth: 0

            - name: Install CE toolchain
              run: |
                  scripts/install-toolchain.sh "$CEDEV_VERSION"
                  echo /opt/CEdev/bin >> "$GITHUB_PATH"

            - name: Build for PC
              run: make pc

            - name: Test
              run: make check

            - name: Build for calculator
              run: make

            - name: Build with CMake
              run: |
                  cmake -S . -B build
                  cmake --build build
